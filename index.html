<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Affan Bin Usman | Robotics & ML</title>
    <link rel="stylesheet" href="assets/css/style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>

<body>

    <div class="layout">
        <!-- Sidebar / Header -->
        <header id="sidebar">
            <div class="profile-container">
                <div class="avatar-container">
                    <img src="https://placehold.co/400x400/1a1c20/3b82f6?text=ABU" alt="Affan Bin Usman"
                        id="profile-img">
                    <div class="status-indicator"></div>
                </div>

                <div class="info-block">
                    <h1 id="name">Affan Bin Usman</h1>
                    <h2 id="role">Machine Learning Research Engineer</h2>
                    <p id="summary" class="summary-text"></p>
                </div>

                <!-- Section Selector / Nav -->
                <nav id="section-nav">
                    <ul>
                        <li><a href="#experience" class="active">Experience</a></li>
                        <li><a href="#publications">Publications</a></li>
                        <li><a href="#education">Education</a></li>
                        <li><a href="#skills">Skills</a></li>
                        <li><a href="#projects">Projects</a></li>
                    </ul>
                </nav>


                <div class="bottom-block">
                    <div class="social-links" id="social-links">
                        <!-- Links injected by JS -->
                    </div>

                    <a href="#" id="email-btn" class="email-btn">
                        <i class="fas fa-envelope"></i> Email Me
                    </a>

                    <div class="location-contact" id="contact-info">
                        <!-- Location injected by JS -->
                    </div>
                </div>
            </div>
        </header>

        <!-- Main Content -->
        <main id="main-content">

            <section id="experience" class="section">
                <h3 class="section-title"><i class="fas fa-briefcase"></i> Experience</h3>
                <div class="cards-container single-col" id="experience-list">
                    <!-- Injected by JS -->
                </div>
            </section>

            <section id="publications" class="section">
                <div class="section-header-row">
                    <h3 class="section-title"><i class="fas fa-book"></i> Publications & Patents</h3>
                    <div class="scholar-badge" id="scholar-badge">
                        <i class="fas fa-quote-right"></i>
                        <span id="scholar-count">Fetching...</span>
                    </div>
                </div>
                <div class="cards-container single-col" id="publications-list">
                    <!-- Injected by JS -->
                </div>
            </section>

            <section id="education" class="section">
                <h3 class="section-title"><i class="fas fa-graduation-cap"></i> Education</h3>
                <div class="cards-container grid-col" id="education-list">
                    <!-- Injected by JS -->
                </div>
            </section>

            <section id="skills" class="section">
                <h3 class="section-title"><i class="fas fa-microchip"></i> Skills</h3>
                <div class="cards-container grid-col" id="skills-list">
                    <!-- Injected by JS -->
                </div>
            </section>

            <section id="projects" class="section">
                <h3 class="section-title"><i class="fas fa-code-branch"></i> Projects</h3>
                <div class="cards-container grid-col" id="projects-list">
                    <!-- Injected by JS -->
                </div>
            </section>

        </main>
    </div>

    <script src="assets/js/main.js"></script>
</body>

</html>
